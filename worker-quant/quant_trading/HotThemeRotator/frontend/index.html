<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>HTR · 仪表盘 V1–V4 (重设计)</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin:0; padding:0; height:100%; background:#0B0F14;
    font-family:"IBM Plex Sans","Noto Sans JP",system-ui,sans-serif; }
  #root { width:100vw; min-height:100vh; display:flex; flex-direction:column; }

  /* ── global app nav (variant switcher) ── */
  .app-nav { display:flex; align-items:center; gap:6px; padding:7px 16px;
    background:var(--htr-surface,#fff); border-bottom:1px solid var(--htr-line,#e6e1d4);
    flex:0 0 auto; z-index:100; overflow-x:auto; white-space:nowrap; }
  .app-brand { font-weight:700; font-size:13px; color:var(--htr-ink,#1a1815); margin-right:10px; }
  .nav-btn { appearance:none; background:transparent; border:1px solid transparent;
    padding:6px 13px; border-radius:7px; font-size:12.5px; color:var(--htr-ink-2,#4c4842);
    cursor:pointer; font-family:inherit; }
  .nav-btn:hover { background:var(--htr-surface-2,#faf8f2); }
  .nav-btn.active { background:var(--htr-accent,#CBA968); color:var(--htr-accent-ink,#17120A); border-color:var(--htr-accent,#CBA968); font-weight:600; }
  .app-nav { backdrop-filter:blur(6px); }
  .app-main { flex:1 1 auto; min-height:0; overflow:auto; background:var(--htr-bg); }
  /* P24-06 "Sumi & Brass" — ambient instrument depth (dark only): a faint brass
     glow top-right + cool indigo top-left, so the ground reads as considered. */
  :root[data-htr-dark="true"] .app-main {
    background:
      radial-gradient(1100px 480px at 85% -6%, rgba(203,169,104,.055), transparent 60%),
      radial-gradient(820px 460px at -4% -2%, rgba(111,141,255,.045), transparent 55%),
      var(--htr-bg);
  }

  /* ── V3 bento (P24-07) ── */
  /* Command band: deep-dive column interlocks with the positions stack. */
  .v3-hero-bento { display:grid; grid-template-columns:minmax(0,1.85fr) minmax(330px,1fr); gap:14px; align-items:start; }
  .v3-hero-main, .v3-hero-side, .v3-work-col { display:flex; flex-direction:column; gap:14px; min-width:0; }
  /* Workbench band: three balanced tiles fill the width below the command area. */
  .v3-work-bento { display:grid; grid-template-columns:330px minmax(0,1fr) 344px; gap:14px; align-items:start; }
  /* Full-width bands (Rule 11.7.8 — nothing towers). */
  .v3-plan-row { align-items:start; }
  .v3-feeds-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; align-items:start; }
  .v3-temp-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
  .v3-leader-grid { display:grid; grid-template-columns:minmax(200px,auto) minmax(0,1fr); gap:32px; align-items:center; }
  .v3-ministat-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; }
  .v3-debate-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }

  /* ── V1 grids ── */
  .v1-grid { display:grid; grid-template-columns:286px minmax(0,1fr) 364px; gap:12px; align-items:start; }
  /* P24-10 — full-width feeds band below V1/V4 grids (Action Board + review cards
     moved out of the tall column so no column towers over the centre). */
  .v1-feeds-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; align-items:start; }
  .v1-hero-grid { display:grid; grid-template-columns:minmax(150px,auto) minmax(0,1fr) auto auto auto; gap:20px; align-items:baseline; }
  .v1-chart-row { display:grid; grid-template-columns:minmax(0,1fr) 196px; gap:8px; }
  .v1-intel-grid { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:20px; }

  /* ── V2 grids ── */
  .v2-body-grid { display:grid; grid-template-columns:minmax(0,1fr) 288px; gap:32px; padding-top:8px; }
  .v2-hero-grid { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:28px; align-items:center; }
  .v2-prose-grid { display:grid; grid-template-columns:1fr 1fr; gap:28px; }
  .v2-market-strip { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; }
  .v2-dual-grid { display:grid; grid-template-columns:1fr 1fr; gap:32px; padding-bottom:8px; }
  .v2-tri-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }

  /* ── V4 grids ── */
  .v4-grid { display:grid; grid-template-columns:256px minmax(0,1fr) 380px; gap:12px; align-items:start; }
  .v4-leader-grid { display:grid; grid-template-columns:auto 1fr 1fr 1fr; gap:14px; align-items:center; }

  @media (max-width:1320px) {
    .v3-hero-bento { grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr); }
    .v3-work-bento { grid-template-columns:300px minmax(0,1fr); }
    .v3-work-bento > .v3-work-col:last-child { grid-column:1 / -1; }
    .v1-grid { grid-template-columns:260px minmax(0,1fr); }
    .v1-grid > div:last-child { grid-column:1 / -1; display:grid !important; grid-template-columns:repeat(3,1fr); gap:12px; }
    .v4-grid { grid-template-columns:240px minmax(0,1fr); }
    .v4-grid > div:last-child { grid-column:1 / -1; }
  }
  @media (max-width:1080px) {
    .v3-hero-bento, .v3-work-bento, .v1-grid, .v4-grid { grid-template-columns:1fr; }
    .v1-grid > div:last-child { grid-template-columns:1fr 1fr; }
    /* P24-01/07 / Rule 11.7.7 — mobile priority. Among the shell's children the
       Action Board comes first, then the command bento, then the workbench, then
       feeds; and inside the command bento the positions stack leads the chart.
       Net order: temp → action → positions → chart/strategy → picker/detail/theme
       → feeds. */
    .v3-plan-row    { order:1; }
    .v3-hero-bento  { order:2; }
    .v3-work-bento  { order:3; }
    .v3-feeds-row   { order:4; }
    .v3-hero-side   { order:1; }
    .v3-hero-main   { order:2; }
    .v3-temp-grid, .v2-market-strip { grid-template-columns:repeat(3,1fr); }
    .v3-leader-grid, .v1-hero-grid, .v2-hero-grid, .v4-leader-grid { grid-template-columns:1fr; gap:16px; }
    .v3-debate-grid, .v2-body-grid, .v2-prose-grid, .v2-dual-grid, .v1-chart-row { grid-template-columns:1fr; }
    .v1-intel-grid { grid-template-columns:1fr; }
    .v1-intel-grid > div:last-child { border-left:none !important; padding-left:0 !important; }
    .v2-tri-grid { grid-template-columns:1fr; }
    .v2-ladder-side { border-left:none !important; padding-left:0 !important; }
    .v2-page { padding:24px 28px !important; }
  }
  @media (max-width:680px) {
    .v1-grid > div:last-child { grid-template-columns:1fr; }
    .v3-temp-grid, .v2-market-strip { grid-template-columns:repeat(2,1fr); }
    .v3-ministat-grid { grid-template-columns:1fr 1fr; }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="src/htr-data.js"></script>
<script type="text/babel" src="src/tweaks-panel.jsx"></script>
<script type="text/babel" src="src/htr-shared.jsx"></script>
<script type="text/babel" src="src/htr-shared2.jsx"></script>
<script type="text/babel" src="src/htr-v3-modals.jsx"></script>
<script type="text/babel" src="src/htr-v1.jsx"></script>
<script type="text/babel" src="src/htr-v2.jsx"></script>
<script type="text/babel" src="src/htr-v3.jsx"></script>
<script type="text/babel" src="src/htr-v4.jsx"></script>
<script type="text/babel" src="src/htr-cards.jsx"></script>
<script type="text/babel" src="src/htr-api.jsx"></script>
</head>
<body>
<div id="root"></div>
<!-- task#7: S株 overlay card — separate ReactDOM root + plain JS, cannot break the main App -->
<!-- P24-03 / Rule 11.7.2 — docked in document flow (was a fixed bottom-right
     overlay that occluded the right rail). Renders as a normal centred card
     below the app. -->
<div id="skabu-root" style="max-width:420px;margin:8px auto 20px;padding:0 20px"></div>
<script src="src/htr-skabu-card.js"></script>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <rect width="200" height="200" fill="#F4F1EA"/>
    <rect x="30" y="30" width="140" height="140" rx="8" fill="none" stroke="#1F3A5F" stroke-width="2"/>
    <rect x="30" y="30" width="140" height="20" rx="8" fill="#1F3A5F"/>
    <text x="100" y="45" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">HTR</text>
    <line x1="42" y1="68" x2="158" y2="68" stroke="#1F7A4D" stroke-width="3"/>
    <line x1="42" y1="82" x2="158" y2="82" stroke="#1F7A4D" stroke-width="2"/>
    <line x1="42" y1="98" x2="158" y2="98" stroke="#1F3A5F" stroke-width="3.5"/>
    <line x1="42" y1="114" x2="158" y2="114" stroke="#355D8C" stroke-width="2"/>
    <line x1="42" y1="130" x2="158" y2="130" stroke="#B23A3A" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="100" y="156" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#4C4842" text-anchor="middle">Price Ladder</text>
  </svg>
</template>

<script type="text/babel" data-presets="env,react">
const { useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primary": "#CBA968",
  "dark": true,
  "density": "regular",
  "bodyFont": "sans",
  "numFont": "mono",
  "layout": "tabs"
}/*EDITMODE-END*/;

function applyTokens(t) {
  const root = document.documentElement;
  root.style.setProperty("--htr-accent", t.primary);
  root.style.setProperty("--htr-accent-soft", `color-mix(in oklab, ${t.primary} 11%, transparent)`);
  root.dataset.htrDark = String(!!t.dark);
  root.dataset.htrDensity = t.density;
  const bodyMap = { sans: `"IBM Plex Sans","Noto Sans JP",system-ui,sans-serif`, serif: `"IBM Plex Serif","Noto Serif JP",Georgia,serif` };
  const numMap = { mono: `"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace`, tabular: `"IBM Plex Sans","Noto Sans JP",system-ui,sans-serif` };
  root.style.setProperty("--htr-font-body", bodyMap[t.bodyFont] || bodyMap.sans);
  root.style.setProperty("--htr-font-num", numMap[t.numFont] || numMap.mono);
}

const VARIANTS = [
  { id: "v1", label: "V1 · 三栏专业终端", Component: () => <V1ProTerminal /> },
  { id: "v2", label: "V2 · 研究备忘录", Component: () => <V2EditorialBrief /> },
  { id: "v3", label: "V3 · 市场温度仪表盘", Component: (p) => <V3MarketDashboard layout={p.layout} /> },
  { id: "v4", label: "V4 · 决策日志为脊", Component: () => <V4WorkflowSpine /> },
];

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [variant, setVariant] = React.useState(() => { try { return localStorage.getItem("htr_variant") || "v3"; } catch (e) { return "v3"; } });
  useEffect(() => { applyTokens(t); }, [t]);
  useEffect(() => { try { localStorage.setItem("htr_variant", variant); } catch (e) {} }, [variant]);

  const active = VARIANTS.find((v) => v.id === variant) || VARIANTS[2];
  const gates = (window.HTR_DATA && window.HTR_DATA.gates) || [];

  return (
    <React.Fragment>
      <nav className="app-nav">
        <span className="app-brand">HotThemeRotator</span>
        {VARIANTS.map((v) => (
          <button key={v.id} className={"nav-btn" + (v.id === variant ? " active" : "")} onClick={() => setVariant(v.id)} aria-pressed={v.id === variant} title={v.id === "v3" ? "默认 / shipping 变体" : "对照变体"}>{v.label}{v.id === "v3" && <span style={{ marginLeft: 6, fontSize: 9, opacity: 0.7 }}>· 默认</span>}</button>
        ))}
        <span style={{ flex: 1 }} />
        {/* Rule 11.10.2 / 四变体均质 — the governance + write-path chips live in the
            GLOBAL nav so proposals(accept/reject) + notifier(toggle) + calibration
            are reachable from EVERY variant, not only V3. (Search + watchlist stay
            V3-local — they need per-variant symbol selection; hoisting them waits on
            the Phase-6 shared symbol-picker state.) */}
        <ProposalInboxChip />
        <CalibrationChip />
        <NotifierChip />
        <GatesChip gates={gates} />
      </nav>
      <main className="app-main htr">
        {active.Component({ layout: t.layout })}
      </main>
      <TweaksPanel title="Tweaks">
        {variant === "v3" && <TweakSection label="布局 (仅 V3)" />}
        {variant === "v3" && <TweakRadio label="详情面板" value={t.layout} options={["tabs", "stack"]} onChange={(v) => setTweak("layout", v)} />}
        <TweakSection label="信息密度" />
        <TweakRadio label="密度" value={t.density} options={["compact", "regular", "comfy"]} onChange={(v) => setTweak("density", v)} />
        <TweakSection label="主题" />
        <TweakColor label="强调色" value={t.primary} options={["#CBA968", "#6E8CFF", "#2D8C8F", "#C46B52"]} onChange={(v) => setTweak("primary", v)} />
        <TweakToggle label="深色模式" value={t.dark} onChange={(v) => setTweak("dark", v)} />
        <TweakSection label="字体" />
        <TweakRadio label="正文" value={t.bodyFont} options={["sans", "serif"]} onChange={(v) => setTweak("bodyFont", v)} />
        <TweakRadio label="数字" value={t.numFont} options={["mono", "tabular"]} onChange={(v) => setTweak("numFont", v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

// Boot — merge REAL /api/dashboard over the offline mock baseline, then enrich
// each real candidate so the V3 detail cards have non-crashing defaults before
// useEnrichedCandidate overlays the authoritative per-symbol data. Mock is only
// a fallback when the backend is unreachable (e.g. static `python -m http.server`).
(async function bootWithApi() {
  const degraded = { offline: false };
  try {
    const resp = await fetch("/api/dashboard", { cache: "no-store" });
    if (!resp.ok) throw new Error("API " + resp.status);
    const api = await resp.json();
    const base = window.HTR_DATA || {};
    const da = (api.meta && api.meta.dataAvailability) || {};
    const list = (k) => (Array.isArray(api[k]) && api[k].length ? api[k] : base[k]);
    // Rule 11.9.4 — a section is "示例数据" when it falls back to mock (real array
    // empty/absent) or the backend reports it unavailable. Surfaced as a banner.
    ["markets", "themes", "newsTimeline", "decisionLog", "gates", "candidates"].forEach((k) => {
      degraded[k] = !(Array.isArray(api[k]) && api[k].length) || da[k] === false;
    });
    // Rule 11.9.4 — non-array sections that fall back to the mock baseline must
    // also be flagged (positions / dailyCockpit). macroNews is intentionally NOT
    // tracked: it has no mock and returns null when absent (no masquerade risk).
    degraded.positions = !api.positions || api.positions.available === false;
    degraded.dailyCockpit = !api.dailyCockpit;
    const cands = (Array.isArray(api.candidates) && api.candidates.length)
      ? api.candidates.map((c) => window.HTR_enrich({ ...c }))
      : base.candidates;
    window.HTR_DATA = {
      ...base,
      ...api,
      meta: { ...base.meta, ...api.meta },
      markets: list("markets"),
      themes: list("themes"),
      candidates: cands,
      positions: api.positions || base.positions,
      newsTimeline: list("newsTimeline"),
      decisionLog: list("decisionLog"),
      gates: list("gates"),
      dailyCockpit: api.dailyCockpit || base.dailyCockpit,
      kline: (cands && cands[0] && cands[0].kline) || base.kline,
      __degraded: degraded,
    };
  } catch (err) {
    console.warn("[HTR] /api/dashboard unavailable — rendering offline mock:", err.message);
    degraded.offline = true;
    if (window.HTR_DATA) window.HTR_DATA.__degraded = degraded;
  } finally {
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  }
})();
</script>
</body>
</html>
