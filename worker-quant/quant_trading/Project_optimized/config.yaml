db_path: japan_market.db

update:
  lookback_days: 730
  universe_file: null

screener:
  asof: null
  top_k: 30
  min_adv: 5000000
  max_cost_per_lot: 250000

model:
  signal_mode: "ridge"
  compare_signal_modes: ["shadow_eq", "shadow_ic"]
  start: "2020-01-01"
  end: null
  H: 20
  train_window: 252
  rebalance_every: 20
  benchmark_ticker: "1321.T"
  benchmark_fast_ma_window: 20
  benchmark_slow_ma_window: 60
  benchmark_hysteresis_enter_pct: 0.01
  benchmark_hysteresis_exit_pct: 0.01
  safe_plot: true
  output_dir: "reports"
  exec:
    initial_capital: 1000000   # 100万日元实际本金
    lot_size_default: 100      # 日本股票标准手数（1手=100股）
    fee_bps: 10.0              # 手续费按千分之一(10bps)试跑
    slippage_bps: 5.0          # 开收盘价差约3-8bps（必须设置）
    impact_k: 0.5              # 市场冲击模型系数
    max_adv_frac: 1.0
    cash_rate_daily: 0.0
    stop_loss_pct: 0.08      # legacy fixed stop-loss fallback
    stop_loss_mode: "atr"
    atr_window: 20
    stop_loss_vol_mult: 6.0
    stop_loss_min_pct: 0.06
    stop_loss_max_pct: 0.20
    max_dd_half: 0.12        # 组合12%回撤降半仓
    max_dd_full: 0.18        # 组合18%回撤全平
    max_dd_reentry_cooldown_days: 20

  # News overlay (optional — enable after running gen_synthetic_news.py)
  news:
    enabled: false
    csv_path: "data/synthetic_news.csv"  # generated by gen_synthetic_news.py

learning:
  enabled: true           # run compute_ic.py after each daily_run
  shadow: false           # shadow=true: compute IC but don't update weights
  lookback_periods: 60    # number of rebalance periods to evaluate IC over
  min_cross_section_n: 25 # minimum screened names per rebalance date for IC

paper:
  enabled: true
  price_mode: "latest"
  slippage_bps: 5.0
  fee_bps: 10.0
  fill_ratio: 1.0

obsidian:
  vault: '/app/quant_trading/quantum investment'
  section: "Quant/Reports"
