[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hot-theme-rotator"
version = "0.1.0"
# NARROWED FROM ">=3.10" (P37-03 step 3, 2026-08-14) — decided on evidence.
#
# The old floor came from a SYNTAX scan: the codebase uses PEP 604 / PEP 585
# generics, and nothing uses a 3.11+ stdlib feature (tomllib, datetime.UTC,
# StrEnum, ExceptionGroup, Self, TaskGroup, file_digest). That reasoning was
# sound and the conclusion was still a claim nobody had tested.
#
# What is actually verified: CPython 3.13.0 on x86_64 Windows, and nothing else
# has ever run this code. The locks are hash-pinned to cp313 wheels, both CI
# lanes pin 3.13 and assert it, and the clean-environment verification refuses
# any other interpreter. Step 3's choice was to build and verify a 3.10 lock and
# matrix, or to narrow the floor to what is real. Nobody needs 3.10 today, so
# narrowing is the honest option and the cheap one.
#
# `>=3.10` was worse than no declaration at all, because a resolver reads it as
# a support claim and would happily install onto an interpreter this project has
# never seen. Widen it again only behind a verified matrix, not behind a scan.
requires-python = ">=3.13"
description = "Japan equity advice-only research dashboard (HotThemeRotator)"
readme = "README.md"

# ---------------------------------------------------------------------------
# Dependencies — DERIVED, not authored (P37-03 step 1)
# ---------------------------------------------------------------------------
# Every entry below is the output of `python tools/audit_import_surface.py`,
# which scans src/ tools/ api/ tests/ scripts/ for import statements and maps
# each importing file to a tier. Do not hand-edit this list: add the import,
# re-run the audit, and let it tell you which group the dependency belongs to.
# The audit fails (exit 2) when code and declaration disagree in either
# direction, and `tests/unit/test_import_surface.py` pins that against the repo.
#
# Version bounds: each lower bound is EXACTLY the version installed in the only
# environment this repo has ever run in (2026-08-14). It is not a minimum-working
# version — nothing older has been tried, and a resolver reads `>=X` as "X and
# everything after it are supported", which would be a claim nobody has tested.
# Pinning the bound at the verified version keeps the declaration to what is
# known, in the conservative direction.
#
# A first pass wrote plausible-looking older floors (yfinance>=0.2.40 while 1.1.0
# is installed, vectorbt>=0.26 against 1.0.0, pytest>=8.0 against 9.0.2) with a
# comment claiming they were verified versions. They were not: that is invented
# compatibility, and it is worse than no bound because it is machine-readable.
#
# Upper bounds are deliberately absent: an untested future release is no more
# tested than an untested old one, and a fabricated ceiling would be the same
# error mirrored. Exact reproducible pinning is P37-03 step 2's lock file.
#
# Layering rule: a dependency belongs to the group whose TIER imports it.
#   core       src/hot_theme_rotator/** (except research/ and backtesting/),
#              plus the tools/ scripts the daily operational lane runs
#   dashboard  api/** and its uvicorn entrypoint
#   research   src/hot_theme_rotator/{research,backtesting}/**, research tools
#   streamlit  the standalone alternative UI, deliberately not in `dashboard`
#   test       tests/** and scripts/**
dependencies = [
    # HTTP for every external data adapter (J-Quants, TDnet RSS, scrapers).
    "requests>=2.34.2",
    # HTML parsing for the Kabutan / Yahoo Japan scrapers and the TDnet parser.
    "beautifulsoup4>=4.14.3",
    # Price and ticker metadata. Core despite every src import site being
    # guarded: those guards return None, so an install without yfinance
    # reports "no prices" while looking healthy — the exact silent degradation
    # Rule 15.10 forbids. Four tools import it unguarded, three of which are
    # daily_routine steps.
    "yfinance>=1.1.0",
    # TDnet revision PDFs (tools/capture_tdnet_revisions.py, a daily_routine step).
    "pdfplumber>=0.11.9",
]

[project.optional-dependencies]
# The FastAPI service backing the four dashboard variants.
# pydantic and starlette are declared explicitly even though FastAPI depends on
# both: api/ imports them directly, and a direct import must not rely on another
# package's transitive graph staying the same.
dashboard = [
    "fastapi>=0.117.1",
    "pydantic>=2.11.9",
    "starlette>=0.48.0",
    "uvicorn>=0.36.0",
]

# Research lane (Rule 15.6 slow lane) — power estimators and vectorbt backtests.
# numba is NOT listed: no module imports it. It arrives transitively through
# vectorbt, which is the only importer of the JIT machinery.
research = [
    "numpy>=2.3.5",
    "pandas>=2.3.2",
    "vectorbt>=1.0.0",
]

# Standalone streamlit app (tools/streamlit_opportunity_app.py). Kept out of
# `dashboard` on purpose: the shipped UI is the zero-build React frontend, and
# folding streamlit in would make installing the shipped UI heavier than the UI.
streamlit = [
    "pandas>=2.3.2",
    "streamlit>=1.53.1",
]

# What the test tier imports DIRECTLY. This is not the same thing as what a
# pytest lane needs installed, and an earlier comment here conflated the two by
# claiming `pip install .[test]` alone could run every test. It cannot, in both
# directions, and the audit now derives the real contract from the import
# closure rather than asserting it:
#
#   fast lane   pytest -m "not slow"   ->  pip install .[test,dashboard]
#   slow lane   pytest -m slow         ->  pip install .[test,research]
#   everything                         ->  pip install .[dev]
#
# `dashboard` is required by the FAST lane because the suite reaches api/, which
# imports pydantic and starlette at module level - so `.[test]` alone cannot even
# collect it. `research` is required by the SLOW lane because vectorbt is
# imported inside a function that only those tests call (the fast lane reaches
# the same module and must never call that function).
#
# What is actually checked, stated precisely because the two halves differ in
# strength: the module-level COLLECTION FLOOR is verified statically (a lane
# cannot even collect without it), while the slow lane's vectorbt need is a
# DECLARED runtime requirement carrying its module+function as a witness -
# static analysis cannot decide whether a deferred import ever executes. Step 3
# (clean-environment install and run) is what turns the second half into a
# verified fact; until then it is a declaration the audit protects, not a
# conclusion it establishes.
test = [
    "pytest>=9.0.2",
    # fastapi.testclient.TestClient is built on httpx and raises at import time
    # without it. No file imports httpx by name, so this requirement is invisible
    # to a static scan; the audit carries it with a witness matched in the AST -
    # 13 test files really execute `from fastapi.testclient import TestClient`.
    # (Matching the plain string instead let the audit's own test file vouch for
    # the requirement, which would have kept httpx alive forever. It counted 14.)
    "httpx>=0.28.1",
    "fastapi>=0.117.1",
    "numpy>=2.3.5",
    "pandas>=2.3.2",
    # The CI workflow structure tests parse the workflow YAML. Structural checks
    # on a workflow that has never run are all this repo can honestly claim
    # (nothing is pushed), so they are worth having and they need a parser.
    "pyyaml>=6.0.3",
    # TOML parser fallback for the import-surface audit. With requires-python
    # narrowed to >=3.13 (step 3) this marker can no longer be selected, so it
    # never installs and never appears in a lock. It is kept because the code
    # path it names is a fail-closed refusal, not a silent wrong answer: if the
    # module is ever imported under an older interpreter in some other checkout,
    # the audit says "no TOML parser, install tomli" instead of guessing at
    # pyproject contents. Declared, unselectable, and stated rather than
    # discovered.
    "tomli>=2.0; python_version < '3.11'",
]

dev = [
    "hot-theme-rotator[dashboard,research,streamlit,test]",
]

# `api/` and `tools/` are intentionally NOT packaged: this project is run from a
# checkout (pytest uses `pythonpath = ["src"]`; tools add `src` and `tools` to
# sys.path at runtime; the API is served as `api.main:create_app` with the repo
# root as CWD). Declaring the src package explicitly keeps setuptools from
# guessing at the flat directories (configs/, data/, reports/, frontend/, ...).
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Local Beta v0 test-lane split (Rule 15.6). Daily smoke lane (pre-open) runs
# `pytest -m "not slow"`; the research regression lane runs `pytest -m slow`
# (vectorbt backtests — important, but not a daily readiness signal).
markers = [
    "slow: research-regression lane — vectorbt backtests with JIT cold-start (numba arrives through vectorbt; nothing here imports it directly). Excluded from the Local Beta v0 daily smoke lane (Rule 15.6). Needs pip install .[test,research].",
]
