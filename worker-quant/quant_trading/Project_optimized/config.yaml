db_path: japan_market.db

update:
  lookback_days: 730
  universe_file: null

fundamental:
  enabled: false
  source: "noop"          # jquants | csv | noop  (jquantsapi 未安装，暂用 noop)
  csv_path: null
  fail_closed: true
  require_available_ts: true
  use_in_live_scoring: true   # 基本面因子进入 ss7 模型评分（P0修复 2026-03-26）
  use_in_learning: true

screener:
  asof: null
  top_k: 50                               # P1修复：扩大候选池，IC t-stat 需要 25+ 只（2026-03-26）
  min_adv: null
  auto_min_adv_from_capital: false        # P1修复：关闭按资本自动推算，避免资本过小导致 universe 收缩
  min_adv_floor: 2000000                  # 最低流动性要求：日均成交额 200万日元
  max_single_position_pct: 0.25
  target_adv_participation: 0.05
  max_cost_per_lot: 500000                # P1修复：直接设定1手上限 50万日元（对应最高股价约5000円/股）
  auto_max_cost_per_lot_from_capital: false  # 关闭自动推算，screener universe 与实际本金解耦
  lot_cost_position_budget_frac: 1.0
  max_cost_per_lot_floor: 50000

model:
  # IC 实测结论 (2026-03-26 更新，universe扩展后重新计算):
  #   P1修复后 universe 60+只，IC 统计功效改善，等本次 compute_ic --shadow 完成后重新评估
  #   signal_mode 维持 ridge，等 paper_days≥30 + IC t-stat≥1.5 + Sharpe≥1.5 后再切换
  signal_mode: "ridge"
  compare_signal_modes: ["ridge", "shadow_eq", "shadow_ic", "shadow_hybrid_ic"]
  start: "2020-01-01"
  end: null
  H: 20
  train_window: 252
  rebalance_every: 20
  benchmark_ticker: "1321.T"
  benchmark_fast_ma_window: 20
  benchmark_slow_ma_window: 60
  benchmark_hysteresis_enter_pct: 0.01
  benchmark_hysteresis_exit_pct: 0.01
  safe_plot: true
  output_dir: "reports"
  exec:
    initial_capital: 400000    # 40万日元实际本金（与 decision.cash / paper.initial_cash 保持一致）
    lot_size_default: 100      # 日本股票标准手数（1手=100股）
    fee_bps: 10.0              # 手续费按千分之一(10bps)试跑
    slippage_bps: 5.0          # 开收盘价差约3-8bps（必须设置）
    impact_k: 0.5              # 市场冲击模型系数
    max_adv_frac: null
    auto_max_adv_frac_from_capital: true
    cash_rate_daily: 0.0
    target_vol_annual_pct: 0.16
    vol_target_lookback: 20
    vol_target_min_scale: 0.35
    vol_target_max_scale: 1.0
    stop_loss_pct: 0.08      # legacy fixed stop-loss fallback
    stop_loss_mode: "atr"
    atr_window: 20
    stop_loss_vol_mult: 6.0
    stop_loss_min_pct: 0.06
    stop_loss_max_pct: 0.20
    max_dd_half: 0.12        # 组合12%回撤降半仓
    max_dd_full: 0.18        # 组合18%回撤全平
    max_dd_reentry_cooldown_days: 20

  # News overlay — 使用免费数据源（Kabutan RSS / Google News / GDELT）
  # news_to_db.py 在每次 daily_run 中自动运行并写入 japan_market.db
  # 若要完全禁用 news overlay，将 enabled 改为 false
  news:
    enabled: true
    lookback_hours: 26.0          # 覆盖盘前 + 盘中，略超 24h 防漏
    sources: "kabutan,google,gdelt"   # 优先级顺序；均免费
    csv_path: ""                  # 保留兼容字段，DB 模式不需要

learning:
  enabled: true           # run compute_ic.py after each daily_run
  shadow: true            # P2修复：shadow=true 计算真实IC但不覆盖生产权重，等验证后手动晋升（2026-03-26）
  lookback_periods: 60    # number of rebalance periods to evaluate IC over
  min_cross_section_n: 20 # P1修复：universe扩展后降低最低截面数要求（25→20，配合实际数据覆盖）

risk_adjusted:
  enabled: true
  factors: ["sharpe_20", "sharpe_60", "sortino_60", "vol_stability"]

promotion:
  min_backtest_sharpe: 1.5    # P2修复：提高晋升门槛（1.0→1.5），防止过早切换信号模式（2026-03-26）
  min_production_ic: 0.02     # 要求 IC 均值 > 2%（之前0=无门槛，等于没有保护）
  min_t_stat: 1.5
  max_drawdown_pct: 20.0
  paper_days_required: 30     # P2修复：提高纸交易天数要求（20→30天）
  min_sharpe_improvement: 0.1 # 要求相对 ridge 至少提升 0.1 Sharpe
  baseline_mode: "ridge"
  max_turnover_cv: 2.5

decision:
  cash: 400000          # 与 exec.initial_capital 保持一致
  lot: 100
  min_trade: 5000
  out_dir: "artifacts/decision"

paper:
  enabled: true
  price_mode: "latest"
  slippage_bps: 5.0
  fee_bps: 10.0
  fill_ratio: 1.0
  initial_cash: 400000  # 与 exec.initial_capital 保持一致

obsidian:
  vault: '/app/quant_trading/quantum investment'
  section: "Quant/Reports"
